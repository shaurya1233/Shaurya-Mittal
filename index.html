<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130e0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Jacquarda+Bastarda+9&display=swap">
<title>Shaurya Mittal — Student Developer · SHAURYA-OS</title>
<style>
:root{--ag:232,146,42;--lg:200,122,34;--d1:#1a110a;--d2:#2b1a0c;--sh:#7a3a12;--bg:#130e0a;--a:#e8922a;--c:#f3d9a4;--r:#d0472a;--ln:#c87a22;--mono:ui-monospace,"Share Tech Mono",Menlo,Consolas,"Courier New",monospace;--bl:"Jacquard 12","Jacquarda Bastarda 9","UnifrakturMaguntia","UnifrakturCook","Old English Text MT","Blackadder ITC",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:radial-gradient(120% 60% at 50% 38%,var(--d2),#130e0a 70%);color:var(--a);font:15px/1.5 var(--mono);overflow:hidden;text-shadow:0 0 6px rgba(var(--ag),.4);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;text-shadow:inherit}
a{color:var(--c)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
[hidden]{display:none!important}
.bl{font-family:var(--bl);font-weight:700;color:var(--c);text-shadow:2px 2px 0 var(--sh),0 0 14px rgba(243,217,164,.35)}
.dim{opacity:.7}
.box{border:2px solid var(--a);box-shadow:6px 6px 0 var(--r);padding:14px;background:var(--d1)}
#boot{position:fixed;inset:0;z-index:40;background:#130e0a;display:flex;flex-direction:column;gap:18px;padding:max(18px,env(safe-area-inset-top)) 18px 18px;overflow:auto;max-width:720px;margin:auto}
#boot .hd{text-align:center}#boot h1{font-size:clamp(30px,9vw,48px)}
.strip{display:flex;height:10px;margin-top:12px}.strip i{flex:1}.strip i:nth-child(1){background:#8a2a1a}.strip i:nth-child(2){background:#d0472a}.strip i:nth-child(3){background:#e8922a}.strip i:nth-child(4){background:#f3d9a4}.strip i:nth-child(5){background:#3a2a14}
#log div{margin-bottom:6px;word-break:break-word}.pb{height:16px;border:2px solid var(--a);margin-top:10px;padding:2px}
#pb{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--a) 0 8px,transparent 8px 11px);transition:width .25s}
#go{text-align:center;letter-spacing:.14em;animation:bk 1s steps(2) infinite}@keyframes bk{50%{opacity:.25}}
#bs{align-self:center;padding:8px 12px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#top{display:flex;border-bottom:1px solid var(--ln);height:42px;padding-top:env(safe-area-inset-top);box-sizing:content-box}
#top button{padding:0 14px;font-size:13px}#logo{border-right:1px solid var(--ln);font-size:20px;text-shadow:none}#logo:hover,#logo:focus-visible{background:var(--a);color:#130e0a}
#mn{display:flex}#mn button:hover{background:rgba(var(--ag),.15)}
#dd{position:absolute;top:calc(43px + env(safe-area-inset-top));z-index:30;background:var(--d1);border:2px solid var(--a);box-shadow:4px 4px 0 var(--r);min-width:180px}
#dd button{display:flex;justify-content:space-between;gap:18px;width:100%;padding:10px 14px}#dd button:hover,#dd button:focus-visible{background:var(--a);color:#130e0a}
#home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:14px 16px 10px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.2em}.name{font-size:clamp(34px,11vw,66px);line-height:1.1;margin:4px 0}
#stage{position:relative;flex:1;min-height:150px;width:min(560px,100%)}#holo{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#sty{font-size:11px;letter-spacing:.12em;margin-bottom:8px}
#tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;width:min(560px,100%);text-align:left}
#tiles button{padding:6px 2px;display:block;width:100%}#tiles b{color:var(--r);font-family:var(--bl);font-size:17px}#tiles small{display:block;opacity:.65;font-size:12px}#tiles span{font-size:clamp(17px,5vw,24px);color:var(--c)}
#tiles em{display:none;font-style:normal;font-size:11px;background:var(--a);color:#130e0a;padding:1px 8px;margin-top:4px;width:max-content}#tiles button:hover em,#tiles button:focus-visible em{display:block}
@media(hover:none){#tiles em{display:none!important}}
#win{position:fixed;inset:0;z-index:35;background:rgba(8,5,3,.72);display:flex;align-items:center;justify-content:center;padding:12px}
.win{width:min(760px,100%);max-height:90dvh;display:flex;flex-direction:column;border:2px solid var(--a);background:var(--d1);box-shadow:6px 6px 0 var(--r)}
.wt{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--a);padding:6px 10px;justify-content:center;position:relative}#wx{position:absolute;left:8px;font-size:22px;padding:2px 8px;line-height:1}
.wb{overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}.wb h2{font-size:clamp(26px,7vw,40px);line-height:1.1}
.in{font:inherit;background:#0e0905;color:var(--c);border:1px solid var(--ln);padding:8px;min-height:40px;flex:1;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--ln);padding:8px 12px;min-height:40px;display:inline-block}.btn:hover,.btn[aria-pressed=true]{background:var(--a);color:#130e0a;text-shadow:none}
.pl{list-style:none;padding:0;display:grid;gap:6px}.pr{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;width:100%;padding:8px;border:1px solid rgba(var(--lg),.4);align-items:center}.pr:hover,.pr:focus-visible{background:rgba(var(--ag),.14);border-color:var(--a)}
.pr b{color:var(--r)}.pt{color:var(--c)}.pr small{grid-column:2/4;opacity:.65}
.tag{font-style:normal;font-size:11px;border:1px solid var(--ln);padding:0 6px;width:max-content;letter-spacing:.06em}.tag.live{background:var(--a);color:#130e0a;text-shadow:none}.tag.concept{border-style:dashed}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;border-top:1px solid var(--ln);padding-top:10px}dt{opacity:.65}
input[type=range]{accent-color:var(--a);width:100%}label{display:grid;gap:4px}label:has(input[type=checkbox]){display:flex;align-items:center;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;background:var(--a);color:#130e0a;padding:6px 14px;opacity:0;transition:.25s;text-shadow:none;pointer-events:none;max-width:92vw}#toast.on{opacity:1;transform:translate(-50%,0)}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55));animation:fl 3s steps(2) infinite}
#crt::after{content:"";position:absolute;left:0;right:0;height:22vh;background:linear-gradient(transparent,rgba(255,170,60,.05),transparent);animation:ro 8s linear infinite}
@keyframes fl{50%{opacity:.88}}@keyframes ro{from{top:-25vh}to{top:100vh}}
@media(prefers-reduced-motion:reduce){#crt,#crt::after,#go{animation:none}}
@media(min-width:760px){#tiles{grid-template-columns:repeat(4,1fr)}#home{padding-top:22px}}
.kh{font-style:normal;opacity:.6;border:1px solid var(--ln);padding:0 6px;font-size:11px}
.bc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--ln);padding-bottom:8px;font-size:13px}.bc span{flex:1}
.win.big{width:min(1100px,100%);height:90dvh}.win.big .wb{flex:1}
.world{position:relative;height:min(64dvh,640px);overflow:hidden;perspective:700px;touch-action:none;border:1px solid var(--ln);cursor:grab}
.plate{position:absolute;left:50%;top:50%;width:150px;text-align:center;will-change:transform,opacity}.plate canvas{width:100%;height:auto;image-rendering:pixelated;display:block;border:1px solid var(--ln)}.plate span{display:block;font-size:16px;line-height:1.2;margin-top:4px}.plate small{opacity:.6;font-size:10px}
.fr{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--ln)}.fr>:first-child{padding:8px;opacity:.7;border-right:1px solid var(--ln)}.fr .in{border:0}
.send{display:block;background:var(--a);color:#130e0a;padding:12px;text-align:center;text-shadow:none;letter-spacing:.1em;text-decoration:none}.lk{display:block;width:100%;border:1px solid var(--ln);padding:8px 12px;text-decoration:none;color:var(--c)}.lk small{display:block;opacity:.65}
.iso{width:100%;height:auto;border:1px solid var(--ln)}.cm{display:block}
#win.peek{background:rgba(8,5,3,.1);align-items:flex-end}#win.peek .win{max-height:44dvh}
</style></head><body>
